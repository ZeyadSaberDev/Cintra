services:
  - type: web
    name: cintra
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    disk:
      name: cintra-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.0
      - key: LOCAL_DATA_DIR
        value: /var/data
      - key: APP_URL
        sync: false
      - key: FREELLMAPI_API_KEY
        sync: false
      - key: FREELLMAPI_BASE_URL
        value: https://freellmapi-zeyad.up.railway.app/v1
      - key: FREELLMAPI_DEFAULT_MODEL
        sync: false
      - key: FREELLMAPI_MODELS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CLEANAPIS_IMAGE_API_KEY
        sync: false
      - key: CLEANAPIS_IMAGE_BASE_URL
        sync: false
      - key: CLEANAPIS_IMAGE_MODEL
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: ADMIN_ACCESS_KEY
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_YEARLY
        sync: false
      - key: STRIPE_PRICE_PRO_PLUS_MONTHLY
        sync: false
